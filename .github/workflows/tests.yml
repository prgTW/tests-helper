name: Tests

on:
  push:  # Keeps the README badge in sync with master
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:  # Allow this workflow to be called by other workflows
  schedule:
    - cron: '0 6 * * 1'  # Weekly: catches breakage from floating tool versions (golangci-lint latest)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Minor line must match go.mod; check-latest picks up every patch (security) release
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Run tests with coverage
        run: go test -v ./... -coverprofile=coverage.out

      - name: Check test coverage
        run: |
          echo "Test coverage report:"
          go tool cover -func=coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Minor line must match go.mod; check-latest picks up every patch (security) release
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
