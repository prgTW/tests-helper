name: Tests

on:
  pull_request:
    branches:
      - master
  workflow_call:  # Allow this workflow to be called by other workflows
  schedule:
    - cron: '0 6 * * 1'  # Weekly: surfaces newly published vulnerabilities without a code change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Minor line must match go.mod; check-latest picks up every patch (security) release
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Run tests with coverage
        run: go test -v ./... -coverprofile=coverage.out

      - name: Check test coverage
        run: |
          echo "Test coverage report:"
          go tool cover -func=coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Minor line must match go.mod; check-latest picks up every patch (security) release
          go-version: '1.27'
          check-latest: true
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
          cache: true

      # Dependabot does not track the Go toolchain; this flags stdlib and module vulnerabilities
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
